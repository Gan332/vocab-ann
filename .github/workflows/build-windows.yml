name: Build (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocab-app-windows-x64
          path: target/release/vocab-app.exe
          retention-days: 30

      - name: Smoke test
        run: |
          if (!(Test-Path target/release/vocab-app.exe)) { throw "Binary not found" }
          Write-Host "Build OK: $((Get-Item target/release/vocab-app.exe).Length / 1MB) MB"